<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Buscar Pokémon</title>
</head>
<body>
    <main>
        <h1>Buscar Pokémon</h1>

        <form id="formPoke">
            <input
                type="number"
                id="idPoke"
                placeholder="Digite o ID"
                min="1"
                required>
            <button type="submit">Buscar</button>
        </form>

        <p id="msg"></p>

        <div id="resultado" hidden>
            <div class="imagem">
                <img src="" alt="Imagem do Pokémon" id="imgPoke">
            </div>
        
            <h2 id="nomePokemon"></h2>
        
            <div class="stats">
                <div class="stat">
                    <span>Experiência</span>
                    <strong id="basePoke"></strong>
                </div>
                <div class="stat">
                    <span>Altura</span>
                    <strong id="alturaPoke"></strong>
                </div>
                <div class="stat">
                    <span>Peso</span>
                    <strong id="pesoPoke"></strong>
                </div>
            </div>
        </div>

    <script src="main.js"></script>
</body>
</html>
